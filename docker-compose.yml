services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["bandit-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build: .
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]

volumes:
  bandit-data:
